# ── Marketing Manager (Haiku) Scrum Config ──
# Template — replace Slack IDs with real values before deploying
profile: marketing-manager
app_name: Haiku

# ── Slack Channels ──
channel_updates: "C0XXXXXXX"        # #marketing-scrum-updates (placeholder)
channel_leadership: "C0XXXXXXX"     # #marketing-leadership (placeholder)

# ── State ──
