api_version: gbrain-schema-pack-v1
name: shogun-enterprise
version: 1.0.0
description: Shogun OS — multi-department enterprise schema pack
gbrain_min_version: 0.39.0
extends: gbrain-base

# Inherit takes_kinds from gbrain-base.
takes_kinds:
  - fact
  - take
  - bet
  - hunch

# Allow borrowing inferred link types from gbrain-base.
borrow_from: []

