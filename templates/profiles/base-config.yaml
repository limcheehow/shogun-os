# ── Base Profile Config — Standard Department ──
# Generated from templates/profiles/base-config.yaml
# All profiles use the default Hermes model config (inherited from main config).
# Override model by editing this file directly.

model:
  default: deepseek-v4-flash
  provider: custom

fallback_providers: []

providers: {}

# MCP servers are auto-synced by: python3 scripts/switch-profile.py mcp-sync
mcp_servers:
  gbrain:
    command: gbrain
    args: [mcp]
  # Profile-specific MCP servers go here