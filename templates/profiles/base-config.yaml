# ── Base Profile Config — Standard Department ──
# Generated from templates/profiles/base-config.yaml
# Override model by running: python3 scripts/switch-profile.py <name> --model <preset>

model:
  default: deepseek-v4-flash
  provider: custom
  base_url: ${PRIMARY_PROVIDER_BASE_URL}
  api_key: ${PRIMARY_PROVIDER_API_KEY}
  api_mode: chat_completions

fallback_providers:
  - provider: ${BACKUP_PROVIDER_NAME}
    model: ${BACKUP_PROVIDER_MODEL}

auxiliary: ${AUXILIARY_MODEL}

providers: {}

# MCP servers are auto-synced by: python3 scripts/switch-profile.py mcp-sync
mcp_servers:
  gbrain:
    command: gbrain
    args: [mcp]
  # Profile-specific MCP servers go here