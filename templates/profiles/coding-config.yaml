# ── Coding Agent Profile Config ──
# Optimized for code generation tasks
# Generated from templates/profiles/coding-config.yaml

model:
  default: ${CODING_MODEL}
  provider: ${CODING_PROVIDER}

fallback_providers:
  - provider: ${BACKUP_PROVIDER_NAME}
    model: ${BACKUP_PROVIDER_MODEL}

providers: {}

mcp_servers:
  gbrain:
    command: gbrain
    args: [mcp]